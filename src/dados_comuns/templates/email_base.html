{% load static %}
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="pt-br">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <title>SIGPAE - Notificação</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
</head>
<body style="margin: 0; padding: 0;">
{% block style_override %}
{% endblock %}
<table style="width: 100%; border-collapse: collapse; border-spacing: 0;">
  <tr>
    <td style="padding: 10px 0 30px 0;">
      <table style="width: 300px; margin: 0 auto; border: 1px solid #cccccc;
                    border-collapse: collapse; border-spacing: 0;">
        <thead>
          <tr>
            <th style="text-align: center; background-color: #70bbd9;">
              <img src="https://hom-sigpae.sme.prefeitura.sp.gov.br/django_static/images/email/email-sigpae.png" alt=""
                   style="display: block;"/>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="background-color: #ffffff; padding: 40px 30px 40px 30px;">
              <table style="width: 100%; border-collapse: collapse; border-spacing: 0;">
                <tr>
                  <th style="color: #0C6B45; text-align: center; font-family: Roboto, sans-serif; line-height: 28px; font-size: 24px; font-weight: normal;">
                    <!-- Titulo do E-mail -->
                    <b>{{ titulo|linebreaksbr }}</b>
                  </th>
                </tr>
                <tr>
                  <td style="padding: 20px 0 30px 0; color: #42474A; font-family: Roboto, sans-serif; font-size: 14px; line-height: 16px; text-align: center;">
                    {% block conteudo %}
                    {% endblock %}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color: #F5F6F8; padding: 30px 30px 30px 30px;">
              <table style="width: 100%; border-collapse: collapse; border-spacing: 0;">
                <thead>
                  <tr>
                    <th style="text-align: center; color: #198459; font-family: Roboto, sans-serif; font-size: 12px; font-weight: normal;">
                      {% if not hidden_email %}
                        <p>smecodaesigpae@sme.prefeitura.sp.gov.br</p>
                      {% endif %}
                    </th>
                  </tr>
                </thead>
              </table>
            </td>
          </tr>
        </tbody>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
