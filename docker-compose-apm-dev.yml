services:
  db:
    image: postgres:14.17-alpine
    container_name: sigpae-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - /home/calvin-spassu/git/sme/sigpae/pgdata_pg14:/var/lib/postgresql/data

  redis:
    image: redis:6.2.0-alpine
    container_name: sigpae-redis-local
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    container_name: sigpae-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - ./esdata:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.24
    container_name: sigpae-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENCRYPTIONKEY=CHANGE_ME_32_characteres_seguros_0001
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=CHANGE_ME_32_characteres_seguros_0002
      - XPACK_REPORTING_ENCRYPTIONKEY=CHANGE_ME_32_characteres_seguros_0003
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:7.17.24
    container_name: sigpae-apm-server
    command: >
      apm-server -e
        -E output.elasticsearch.hosts=["elasticsearch:9200"]
        -E apm-server.host="0.0.0.0:8200"
        -E apm-server.kibana.enabled=true
        -E apm-server.kibana.host="kibana:5601"
    ports:
      - "8200:8200"
    depends_on:
      - elasticsearch
      - kibana

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sigpae-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.24
    container_name: sigpae-logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    environment:
      - XPACK_MONITORING_ENABLED=false
    depends_on:
      - rabbitmq
      - elasticsearch